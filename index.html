<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahabat Wisata - Form Pemesanan</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #eef2f7; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 450px; }
    .header { text-align: center; margin-bottom: 22px; border-bottom: 2px solid #1e3a8a; padding-bottom: 12px; }
    .header h2 { color: #1e3a8a; margin: 0 0 4px 0; font-size: 22px; text-transform: uppercase; letter-spacing: 0.5px; }
    .header p { color: #d97706; font-weight: 700; margin: 0; font-size: 13px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 13px; }
    input, select, textarea { width: 100%; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30,58,138,0.1); }
    button { width: 100%; padding: 13px; background-color: #1e3a8a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { background-color: #d97706; }
    .status { margin-top: 16px; text-align: center; font-weight: 600; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>SAHABAT WISATA</h2>
    <p>Formulir Pemesanan Layanan</p>
  </div>

  <form id="bookingForm">
    <div class="form-group">
      <label>Nama Pelanggan</label>
      <input type="text" id="nama" required placeholder="Masukkan Nama Lengkap">
    </div>

    <div class="form-group">
      <label>No. WhatsApp / Telepon</label>
      <input type="tel" id="whatsapp" required placeholder="Contoh: 08123456789">
    </div>

    <div class="form-group">
      <label>Alamat Penjemputan / Rumah</label>
      <textarea id="alamat" rows="2" placeholder="Masukkan Alamat Lengkap"></textarea>
    </div>

    <div class="form-group">
      <label>Jenis Pelayanan</label>
      <select id="layanan" required onchange="updateHarga()">
        <option value="">-- Pilih Layanan --</option>
        <option value="SW01 - PRIVATE TRIP SUNRISE BROMO" data-harga="750000">PRIVATE TRIP SUNRISE BROMO</option>
        <option value="SW02 - OPEN TRIP SUNRISE BROMO" data-harga="350000">OPEN TRIP SUNRISE BROMO</option>
        <option value="SW03 - TRAVEL MALANG JUANDA" data-harga="120000">TRAVEL MALANG JUANDA</option>
        <option value="SW04 - TRAVEL JUANDA MALANG" data-harga="120000">TRAVEL JUANDA MALANG</option>
        <option value="SW05 - RENT CAR / CARTER MOBIL" data-harga="500000">RENT CAR / CARTER MOBIL</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tanggal Pelaksanaan</label>
      <input type="date" id="tanggal" required>
    </div>

    <div class="form-group">
      <label>Jumlah Peserta / Unit</label>
      <input type="number" id="jumlah" min="1" value="1" required onchange="hitungTotal()" onkeyup="hitungTotal()">
    </div>

    <div class="form-group">
      <label>Estimasi Total Biaya</label>
      <input type="text" id="total_display" readonly style="background-color: #f1f5f9; font-weight: 700; color: #1e3a8a;">
      <input type="hidden" id="harga">
    </div>

    <button type="submit" id="btnSubmit">Kirim Pemesanan</button>
  </form>

  <div id="status" class="status"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjNuJA_jpMCKz9TqbavEOxQyGAYAy-L5QfKFtilJVBfJJjpD6KOX8momn_g_ay64l_gg/exec";

  function updateHarga() {
    const selectLayanan = document.getElementById("layanan");
    const selectedOption = selectLayanan.options[selectLayanan.selectedIndex];
    const harga = selectedOption.getAttribute("data-harga") || 0;
    
    document.getElementById("harga").value = harga;
    hitungTotal();
  }

  function hitungTotal() {
    const harga = parseFloat(document.getElementById("harga").value) || 0;
    const jumlah = parseInt(document.getElementById("jumlah").value) || 1;
    const total = harga * jumlah;
    
    document.getElementById("total_display").value = "Rp " + total.toLocaleString("id-ID");
  }

  document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const btn = document.getElementById("btnSubmit");
    const statusDiv = document.getElementById("status");
    btn.innerText = "Memproses...";
    btn.disabled = true;

    const formData = {
      nama: document.getElementById("nama").value,
      whatsapp: document.getElementById("whatsapp").value,
      alamat: document.getElementById("alamat").value,
      layanan: document.getElementById("layanan").value,
      tanggal: document.getElementById("tanggal").value,
      jumlah: document.getElementById("jumlah").value,
      harga: document.getElementById("harga").value
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(response => {
      if(response.result === "success") {
        statusDiv.style.color = "#16a34a";
        statusDiv.innerText = "✓ Pemesanan Berhasil!\nNo Transaksi: " + response.no_transaksi;
        document.getElementById("bookingForm").reset();
        document.getElementById("total_display").value = "";
      } else {
        throw new Error(response.message);
      }
    })
    .catch(error => {
      statusDiv.style.color = "#dc2626";
      statusDiv.innerText = "Terjadi kesalahan saat menyimpan data.";
      console.error("Error!", error);
    })
    .finally(() => {
      btn.innerText = "Kirim Pemesanan";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
